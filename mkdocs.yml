site_name: "Boomerang v3"
site_description: "Intelligent multi-agent orchestration for OpenCode — trust-weighted memini-ai memory, 8-step protocol, specialist sub-agents"
site_url: https://veedubin.github.io/Boomerang-v3/
repo_url: https://github.com/Veedubin/Boomerang-v3
repo_name: Veedubin/Boomerang-v3
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Agents: agents.md
  - Protocol: protocol.md
  - Memory: memory.md
  - Configuration: configuration.md
  - Architecture:
      - Overview: architecture.md
      - Concurrency: concurrency.md
      - Concurrency Analysis: CONCURRENCY_ARCHITECTURE.md
      - OpenCode Feature Research: CONFIG_RESEARCH.md
  - Changelog: changelog.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Veedubin/Boomerang-v3
      name: Boomerang-v3 on GitHub
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@veedubin/boomerang-v3
      name: "@veedubin/boomerang-v3 on npm"